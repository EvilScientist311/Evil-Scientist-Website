{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__nav-cluster">
            <ul class="masthead__nav-cluster-list">
              <li class="masthead__menu-item masthead__nav-link {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
                <a href="{{ base_path }}/"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}><i class="fa-solid fa-house masthead__nav-icon" aria-hidden="true"></i><span>Home</span></a>
              </li>
              {% for link in site.data.navigation.main %}
                {% if link.url contains 'http' %}
                  {% assign domain = '' %}
                {% else %}
                  {% assign domain = base_path %}
                {% endif %}
                <li class="masthead__menu-item masthead__nav-link {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
                  <a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url and link.url != '/' %} aria-current="page"{% endif %}>{% if link.icon %}<i class="{{ link.icon }} masthead__nav-icon" aria-hidden="true"></i>{% endif %}<span>{{ link.title }}</span></a>
                </li>
              {% endfor %}
            </ul>
          </li>
        </ul>
        <div class="mobile-nav-row">
          <div class="mobile-nav-right">
            <div id="theme-toggle" class="masthead__menu-item masthead__theme">
              <a role="button" aria-label="Toggle dark mode" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
            </div>
            <button type="button" class="greedy-nav__toggle menu-button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav-menu">
              <span class="greedy-nav__toggle-icon" aria-hidden="true">☰</span>
              <span class="greedy-nav__toggle-close" aria-hidden="true">✕</span>
              <span class="greedy-nav__toggle-label">Menu</span>
            </button>
          </div>
        </div>
        <ul id="site-nav-menu" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<script>
  (function () {
    var icon = document.getElementById("theme-icon");
    if (!icon) {
      return;
    }

    var isDark =
      document.documentElement.getAttribute("data-theme") === "dark" ||
      document.documentElement.getAttribute("data-theme-active") === "dark";

    icon.classList.toggle("fa-sun", !isDark);
    icon.classList.toggle("fa-moon", isDark);
  })();

  (function () {
    var nav = document.querySelector(".masthead__nav-cluster-list");
    var active = nav && nav.querySelector(".masthead__nav-link.selected > a");
    var desktop = window.matchMedia("(min-width: 924px)");
    var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    var navigating = false;
    var pageCache = {};

    if (!nav || !active) {
      return;
    }

    function placeSlider(link) {
      var navRect = nav.getBoundingClientRect();
      var linkRect = link.getBoundingClientRect();
      var left = linkRect.left - navRect.left;
      var width = linkRect.width;

      if (link.parentElement === nav.firstElementChild) {
        left = 0;
        width = linkRect.right - navRect.left;
      } else if (link.parentElement === nav.lastElementChild) {
        width = navRect.right - linkRect.left;
      }

      nav.style.setProperty("--nav-slider-left", left + "px");
      nav.style.setProperty("--nav-slider-top", "0px");
      nav.style.setProperty("--nav-slider-width", width + "px");
      nav.style.setProperty("--nav-slider-height", navRect.height + "px");
      nav.style.setProperty("--nav-slider-radius", window.getComputedStyle(link).borderRadius);
    }

    function initialiseSlider() {
      nav.classList.remove("nav-slider-ready");

      if (!desktop.matches) {
        return;
      }

      placeSlider(active);
      window.requestAnimationFrame(function () {
        nav.classList.add("nav-slider-ready");
      });
    }

    function wait(milliseconds) {
      return new Promise(function (resolve) {
        window.setTimeout(resolve, milliseconds);
      });
    }

    function fetchPage(url) {
      if (!pageCache[url]) {
        pageCache[url] = window.fetch(url, { credentials: "same-origin" })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Page request failed");
            }
            return response.text();
          })
          .catch(function (error) {
            delete pageCache[url];
            throw error;
          });
      }

      return pageCache[url];
    }

    function updatePage(html, url, link, pushState) {
      var parser = new DOMParser();
      var nextDocument = parser.parseFromString(html, "text/html");
      var currentContent = document.getElementById("site-content");
      var nextContent = nextDocument.getElementById("site-content");

      if (!currentContent || !nextContent) {
        window.location.assign(url);
        return;
      }

      var fadeOut = reducedMotion.matches
        ? Promise.resolve()
        : currentContent.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: 180, easing: "ease", fill: "forwards" }
          ).finished;

      fadeOut.then(function () {
        currentContent.innerHTML = nextContent.innerHTML;
        document.title = nextDocument.title;
        document.body.className = nextDocument.body.className;

        if (nextDocument.body.hasAttribute("data-page")) {
          document.body.setAttribute("data-page", nextDocument.body.getAttribute("data-page"));
        } else {
          document.body.removeAttribute("data-page");
        }

        nav.querySelectorAll(".masthead__nav-link").forEach(function (item) {
          item.classList.remove("selected", "is-slide-source", "is-slide-target");
          item.querySelector("a").removeAttribute("aria-current");
        });

        active = link;
        active.parentElement.classList.add("selected");
        active.setAttribute("aria-current", "page");
        nav.classList.remove("is-sliding");
        placeSlider(active);

        if (pushState) {
          window.history.pushState({}, "", url);
        }

        window.scrollTo(0, 0);
        currentContent.getAnimations().forEach(function (animation) {
          animation.cancel();
        });

        if (!reducedMotion.matches) {
          currentContent.animate(
            [{ opacity: 0 }, { opacity: 1 }],
            { duration: 300, easing: "ease", fill: "both" }
          );
        }

        if (window.initSiteAnimations) {
          window.initSiteAnimations();
        }

        if (window.initHomeTimeline) {
          window.initHomeTimeline();
        }

        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([currentContent]);
        }

        navigating = false;
      });
    }

    function navigate(url, link, pushState) {
      navigating = true;
      nav.classList.add("is-sliding");
      active.parentElement.classList.add("is-slide-source");
      link.parentElement.classList.add("is-slide-target");
      placeSlider(link);

      Promise.all([fetchPage(url), wait(320)])
        .then(function (results) {
          updatePage(results[0], url, link, pushState);
        })
        .catch(function () {
          window.location.assign(url);
        });
    }

    nav.querySelectorAll(".masthead__nav-link > a").forEach(function (link) {
      link.addEventListener("click", function (event) {
        if (!desktop.matches || reducedMotion.matches || navigating || link === active || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        event.preventDefault();
        if (event.detail) {
          link.blur();
        }
        navigate(link.href, link, true);
      });

      link.addEventListener("mouseenter", function () {
        fetchPage(link.href).catch(function () {});
      }, { once: true });
    });

    initialiseSlider();
    window.addEventListener("resize", function () {
      window.requestAnimationFrame(initialiseSlider);
    });

    window.addEventListener("popstate", function () {
      var link = Array.prototype.find.call(
        nav.querySelectorAll(".masthead__nav-link > a"),
        function (item) {
          return new URL(item.href).pathname === window.location.pathname;
        }
      );

      if (link && link !== active && !navigating) {
        navigate(window.location.href, link, false);
      }
    });
  })();
</script>
